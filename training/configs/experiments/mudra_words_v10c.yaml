# v10 candidate: v9 + all recorded takes (Teach a sign; 47 takes / 9 words on 2026-10-19, new: FROM, PUNE),
# each training take listed 6 times (build_app_split.py --train-repeat 6). Starts from v9's weights.
#     python training/scripts/build_app_split.py --base combined_words_v3 --name combined_words_v5_app_r6 --train-repeat 6
#     python training/scripts/train.py --config mudra_words_v10c.yaml --name combined_v10c
base: mudra_words_desk.yaml
init_from: experiments/runs/combined_v9_20261018-132122

data:
  split_dir: data/metadata/splits/combined_words_v5_app_r6

train:
  epochs: 60
  warmup_epochs: 2
  patience: 25
  lr: 0.0001
